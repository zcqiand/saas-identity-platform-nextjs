name: ci

# saas-identity-platform-nextjs (Next.js 15 full-stack with PostgreSQL)
# 推送链:
# - branch push(master/main)→ 只跑 test(对齐门禁 L1-L4)
# - tag push(v<X>.<Y>.<Z>-<YYYYMMDD> per tag.md §1)  → test + docker build & push + VPS 部署
# 镜像名/SSH 路径/部署脚本用 ${{ github.event.repository.name }} 避免跨仓劫持。
on:
  push:
    branches: [main, master]
    tags:
      - "v*"
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # node 24 与本仓 lockfile 一致
          node-version: "24"
          cache: "npm"
          registry-url: https://registry.npmmirror.com/
      # shared 仓作为 sibling 被 checkout(gen:shared 读 ../saas-identity-platform-shared/...)
      # multi-repo-family.md §2 强制 sibling 引用,不以包依赖 import
      - name: Checkout shared sibling
        run: git clone --depth 1 https://x-access-token:${GITHUB_TOKEN}@github.com/zcqiand/saas-identity-platform-shared.git ../saas-identity-platform-shared
      - name: Checkout msw sibling
        run: git clone --depth 1 https://x-access-token:${GITHUB_TOKEN}@github.com/zcqiand/saas-identity-platform-msw.git ../saas-identity-platform-msw
      - name: Install dependencies
        run: npm ci
      # shared-openapi.yaml 生成 src/api/endpoints/(gitignored,见 CLAUDE.md §3)
      - name: gen:shared
        run: npm run gen:shared
      # 本仓用 PostgreSQL(不在 CI 起),build 阶段不连 DB;但 next build "Collecting page data"
      # 会 import 数据库路由代码 → 触发 nextjs-full-stack §凭据 检查,DATABASE_URL 缺值即 throw。
      # 用占位符 URL 让 build 通过(实际 deploy 阶段由 saas.env / SAAS_DATABASE_URL secret 注入)。
      - name: Build
        run: npm run build
        env:
          DATABASE_URL: "postgresql://placeholder:placeholder@localhost:5432/placeholder?schema=public"
      - name: L1 format
        run: npx --no prettier --check src tests
      - name: L2 lint
        run: npx --no eslint src tests
      - name: L3 typecheck
        run: npx --no tsc --noEmit
      - name: L4 test
        run: npx --no vitest run

  # tag push → test 绿 → docker build & push → VPS pull + restart
  # saas.env 自举由 deploy/<repo>.sh 脚本处理(包含 DATABASE_URL 生成 + JWT 密钥等)
  deploy:
    runs-on: ubuntu-latest
    needs: test
    if: startsWith(github.ref, 'refs/tags/')
    concurrency:
      group: deploy-${{ github.event.repository.name }}-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # secrets 全部建在 Repository 级,不声明 environment
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/${{ github.event.repository.name }}:latest
            ${{ secrets.DOCKER_USERNAME }}/${{ github.event.repository.name }}:${{ github.ref_name }}

      - name: Pull image and restart container on VPS
        uses: appleboy/ssh-action@v1
        # appleboy/ssh-action@v1 的 ${{ secrets.* }} 不会自动进 SSH 远端 shell;
        # step env 注入 Actions env,with.envs 列出要转发的名字 (逗号分隔)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          # 不传 fingerprint,走 TOFU
          envs: DATABASE_URL
          script: |
            # 自举: 首次部署无 /home/deploy/<repo>/ 时自动建 + 拉 deploy 脚本
            # saas.env: 缺时从 env DATABASE_URL 自举,deploy script 也支持
            set -e
            REPO="${{ github.event.repository.name }}"
            DEPLOY_DIR="/home/deploy/$REPO"
            mkdir -p "$DEPLOY_DIR"
            cd "$DEPLOY_DIR"
            # 每次 deploy 都拉最新 deploy 脚本(不是只在缺失时拉),否则 VPS 上缓存的旧版
# (无 saas.env 自举逻辑)会让新部署 fail。脚本内 idempotent。
            curl -fsSL "https://raw.githubusercontent.com/zcqiand/${REPO}/refs/heads/master/deploy/${REPO}.sh" -o "$REPO.sh"
            chmod +x "$REPO.sh"
            echo "→ env on remote: DATABASE_URL_set=$([ -n "${DATABASE_URL:-}" ] && echo yes || echo no)"
            if [ "$REPO" = "saas-identity-platform-nextjs" ] && [ ! -f saas.env ]; then
              if [ -n "$DATABASE_URL" ]; then
                echo "→ saas.env will be bootstrapped by deploy script from DATABASE_URL env"
              else
                echo "ERROR: saas.env missing and DATABASE_URL secret not set, deploy script will fail-fast" >&2
              fi
            fi
            sh "$REPO.sh" "${{ secrets.DOCKER_USERNAME }}" "${{ secrets.DOCKER_PASSWORD }}" "${{ github.ref_name }}"
